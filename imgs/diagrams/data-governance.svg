<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="govTitle govDesc">
  <title id="govTitle">Data governance for AI</title>
  <desc id="govDesc">Data is classified and governed before it becomes safely usable for AI systems.</desc>
  <rect width="640" height="360" fill="#0a2540"/>
  <rect x="24" y="24" width="592" height="312" rx="16" fill="#0f2f4d"/>
  <text x="48" y="64" fill="#f4f7fb" font-family="Georgia, serif" font-size="22">Data governance for AI</text>
  <text x="48" y="92" fill="#9db0c4" font-family="system-ui, sans-serif" font-size="13">Classify ’ govern ’ make safely usable</text>
  <circle cx="140" cy="210" r="58" fill="#163a5c" stroke="#7eb6ff" stroke-width="2"/>
  <text x="140" y="206" text-anchor="middle" fill="#f4f7fb" font-family="system-ui, sans-serif" font-size="14">Raw data</text>
  <text x="140" y="226" text-anchor="middle" fill="#9db0c4" font-family="system-ui, sans-serif" font-size="11">classify</text>
  <path d="M198 210 H250" stroke="#ff6b35" stroke-width="2"/>
  <polygon points="250,204 266,210 250,216" fill="#ff6b35"/>
  <circle cx="330" cy="210" r="58" fill="#163a5c" stroke="#ff6b35" stroke-width="2"/>
  <text x="330" y="206" text-anchor="middle" fill="#f4f7fb" font-family="system-ui, sans-serif" font-size="14">Policy</text>
  <text x="330" y="226" text-anchor="middle" fill="#9db0c4" font-family="system-ui, sans-serif" font-size="11">govern</text>
  <path d="M388 210 H440" stroke="#ff6b35" stroke-width="2"/>
  <polygon points="440,204 456,210 440,216" fill="#ff6b35"/>
  <circle cx="520" cy="210" r="58" fill="#ff6b35"/>
  <text x="520" y="206" text-anchor="middle" fill="#0a2540" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Safe AI</text>
  <text x="520" y="226" text-anchor="middle" fill="#0a2540" font-family="system-ui, sans-serif" font-size="11">usable data</text>
</svg>
